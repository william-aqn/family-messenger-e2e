name: family_messenger_e2e
description: "End-to-end encrypted messenger client (Android, iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Protocol primitives (X25519, Ed25519, XChaCha20-Poly1305, HKDF, Argon2id).
  cryptography: ^2.9.0
  # Calls and screen sharing.
  flutter_webrtc: ^1.6.0
  # Foreground service required for Android screen capture (MediaProjection).
  flutter_background: ^1.3.0
  # Account keys and session token in the platform keystore.
  flutter_secure_storage: ^9.2.0
  web_socket_channel: ^3.0.0
  http: ^1.2.0
  file_picker: ^10.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

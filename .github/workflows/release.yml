name: release
# The only workflow, manual only. Runs the tests, builds the server binaries
# and every client for one version and publishes them as a GitHub Release
# (the tag is created on the chosen commit). Start it from the Actions tab
# with the version, e.g. v0.2.0; that string becomes the tag and the build
# number shown by the clients and the server. The tests run only when the
# "run tests" box is ticked. Everything but the Windows app runs on the
# self-hosted Linux runner; the Windows app needs a Windows machine.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0 (becomes the tag and the build number)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run the tests first (Go, web, browser, Flutter); a failure blocks the release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.2
  APP_VERSION: ${{ inputs.version }}

jobs:
  # Fast, readable diagnostics for the self-hosted runner: the setup actions
  # only print obscure errors when the host lacks a tool or a library.
  check-runner:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Runner facts
        run: |
          . /etc/os-release 2>/dev/null && echo "os: $PRETTY_NAME" || true
          echo "arch: $(uname -m)  user: $(id -un)  cpus: $(nproc)  mem: $(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo) MB  free disk: $(df -h "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "sudo: $(sudo -n true 2>/dev/null && echo passwordless || echo 'not available without a password')"
      - name: Required tools
        run: |
          missing=""
          for t in git curl tar gzip xz unzip zip sha256sum; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          (ldconfig -p 2>/dev/null || /sbin/ldconfig -p 2>/dev/null) | grep -q 'libatomic.so.1' || missing="$missing libatomic.so.1(node)"
          if [ -n "$missing" ]; then
            echo "::error::missing on the runner:$missing. Debian/Ubuntu: apt-get install -y git curl ca-certificates xz-utils unzip zip libatomic1"
            exit 1
          fi
          echo "all required tools are present"

  # Optional gate ("run tests" box): Go, web unit, browser and Flutter tests.
  # The builds run in parallel; the release job waits for this one.
  test:
    if: ${{ inputs.run_tests }}
    needs: check-runner
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Persistent caches in the runner tool cache
        run: |
          {
            echo "PUB_CACHE=$RUNNER_TOOL_CACHE/pub-cache"
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Trust the SDK checkout as root
        run: git config --global --add safe.directory '*'
      - name: Go tests
        run: |
          set -o pipefail
          { go vet ./... && go test ./...; } 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      - name: Web unit tests and build
        working-directory: web
        run: |
          set -o pipefail
          { npm ci --no-audit --no-fund && npm test && npm run build; } 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # The browser lands in the tool cache; its system libraries are installed
      # by apt when the runner image lacks them (root, so no sudo involved).
      - name: Browser tests (chats, groups, calls and screen sharing with fake media)
        working-directory: web
        run: |
          set -o pipefail
          { npx playwright install --with-deps chromium && npx playwright test; } 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter analysis and tests
        working-directory: app
        run: |
          set -o pipefail
          { flutter pub get && flutter analyze && flutter test; } 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      - name: Report the failure
        if: failure()
        run: |
          msg="$(grep -E -i 'FAIL|error|✘|failed|Exception|Expected' "$RUNNER_TEMP/test.log" 2>/dev/null | tail -n 40 | tail -c 3500 | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Tests failed::${msg:-no test output captured}"

  web:
    needs: check-runner
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  server:
    needs: web
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/webui/dist
      - name: Cross-compile the server
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/william-aqn/family-messenger-e2e/internal/api.Version=${APP_VERSION}" \
              -o "dist/server-$os-$arch$ext" ./cmd/server
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-server
          path: dist

  android:
    needs: check-runner
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # On the self-hosted runner only the tool cache survives a rebuild of
      # the runner container, so the SDK, Gradle and pub caches live there
      # (the runner context is not allowed in a job-level env, hence GITHUB_ENV).
      - name: Persistent caches in the runner tool cache
        run: |
          {
            echo "ANDROID_HOME=$RUNNER_TOOL_CACHE/android-sdk"
            echo "ANDROID_SDK_ROOT=$RUNNER_TOOL_CACHE/android-sdk"
            echo "GRADLE_USER_HOME=$RUNNER_TOOL_CACHE/gradle"
            echo "PUB_CACHE=$RUNNER_TOOL_CACHE/pub-cache"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Command-line tools with the licences accepted; Gradle then downloads
      # the platform, build-tools and NDK the app asks for (a few GB, kept
      # between runs).
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Gradle limits for a shared runner (4 GB heap, no lingering daemons)
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx1g
          EOF
      # The runner is root and tar keeps the archive's owner, so git (which the
      # flutter launcher runs inside the SDK) would refuse the SDK directory.
      - name: Trust the SDK checkout as root
        run: git config --global --add safe.directory '*'
      # The app replaces itself on Android by handing the APK to the package
      # manager, which accepts it only when it is signed with the key the
      # installed build carries. That key therefore has to outlive the machine
      # that builds the release: this writes it from the repository secrets
      # into the key.properties the Gradle build reads. Without the secrets the
      # build falls back to the Android debug key, which is what every release
      # so far was signed with — see android/signing-key.sha256.
      - name: Signing key from the repository secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64: the APK is signed with the build machine's debug key"
            exit 0
          fi
          # Half a set of secrets would otherwise reach Gradle as an empty alias
          # or password and come back as "Keystore was tampered with", which
          # says nothing about what is actually missing.
          for name in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error title=Incomplete signing secrets::ANDROID_KEYSTORE_BASE64 is set but $name is not"; exit 1; }
          done
          umask 077
          ks="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
          # Reading the key back is the cheapest way to learn that the secret is
          # truncated, or that the alias is spelt differently, before a Gradle
          # failure halfway through the build has to be read for it.
          keytool -list -keystore "$ks" -storepass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 || {
            echo "::error title=Signing key unusable::the keystore from the secrets holds no key '$ANDROID_KEY_ALIAS' under the given password, or the base64 is truncated"
            exit 1
          }
          cat > "$GITHUB_WORKSPACE/app/android/key.properties" <<EOF
          storeFile=$ks
          storePassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build APK and App Bundle
        working-directory: app
        run: |
          set -o pipefail
          # The version code has to grow with the tag. Until now every release
          # carried the 1 from pubspec.yaml, so a phone showed "0.1.0" whatever
          # the release said and Android could not tell an update from a
          # downgrade; v0.2.4 becomes 204.
          name="${APP_VERSION#v}"
          code="$(printf '%s' "$name" | awk -F'[.-]' '{printf "%d", $1 * 10000 + $2 * 100 + $3}')"
          [ "${code:-0}" -gt 0 ] || { echo "::error::cannot derive a version code from ${APP_VERSION}"; exit 1; }
          {
            flutter --version
            flutter pub get
            flutter build apk --release --build-name="$name" --build-number="$code" --dart-define=APP_VERSION=${APP_VERSION}
            flutter build appbundle --release --build-name="$name" --build-number="$code" --dart-define=APP_VERSION=${APP_VERSION}
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/family-messenger-${APP_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/family-messenger-${APP_VERSION}.aab"
      # A signing key that changes orphans every installed app: Android will not
      # replace a package with one signed differently, and the user's only way
      # out is to uninstall and lose nothing but their patience. Better to lose
      # the release than to publish an APK nobody can install over what they
      # have — the debug keystore this is signed with today lives in the
      # runner container and does not survive its rebuild.
      - name: The APK must carry the key installed apps expect
        run: |
          want="$(grep -v '^#' "$GITHUB_WORKSPACE/app/android/signing-key.sha256" | tr -d '[:space:]')"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          got="$("$apksigner" verify --print-certs "$GITHUB_WORKSPACE/dist/family-messenger-${APP_VERSION}.apk" \
                 | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "signing certificate: $got"
          [ "$got" = "$want" ] || {
            echo "::error title=Signing key changed::the APK is signed with $got, but apps installed from earlier releases expect $want (app/android/signing-key.sha256)"
            exit 1
          }
      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$GITHUB_WORKSPACE/app/android/key.properties"
      # The tail of the build output as an annotation: readable through the
      # API without access to the job logs.
      - name: Report the failure
        if: failure()
        run: |
          msg="$(tail -n 40 "$RUNNER_TEMP/build.log" 2>/dev/null | tail -c 3500 | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Android build failed::${msg:-no build output captured}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-android
          path: dist

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Windows desktop app
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release "--dart-define=APP_VERSION=$env:APP_VERSION"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          # ZipFile rather than Compress-Archive so entries use forward slashes; the
          # archive root is the app folder itself, which the in-app updater expects.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory("$PWD\build\windows\x64\runner\Release", "$env:GITHUB_WORKSPACE\dist\family-messenger-windows-x64-$env:APP_VERSION.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist

  linux:
    needs: check-runner
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Persistent pub cache in the runner tool cache
        run: echo "PUB_CACHE=$RUNNER_TOOL_CACHE/pub-cache" >> "$GITHUB_ENV"
      - name: Linux desktop build dependencies (a self-hosted runner has them installed once)
        run: |
          missing=""
          for p in clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            sudo -n apt-get update && sudo -n apt-get install -y $missing
          fi
      - name: Toolchain sanity check (a Debian host also needs the libstdc++ headers)
        run: |
          printf 'int main() { return 0; }\n' > "$RUNNER_TEMP/probe.cc"
          if ! clang++ "$RUNNER_TEMP/probe.cc" -o "$RUNNER_TEMP/probe"; then
            echo "::error::clang++ cannot build a C++ program on this runner; on Debian/Ubuntu install libstdc++-<N>-dev matching the g++ version (e.g. libstdc++-12-dev)"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Trust the SDK checkout as root
        run: git config --global --add safe.directory '*'
      - name: Build Linux desktop app
        working-directory: app
        run: |
          set -o pipefail
          {
            flutter --version
            flutter pub get
            flutter build linux --release --dart-define=APP_VERSION=${APP_VERSION}
          } 2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/dist/family-messenger-linux-x64-${APP_VERSION}.tar.gz" bundle
      - name: Report the failure
        if: failure()
        run: |
          msg="$(tail -n 40 "$RUNNER_TEMP/build.log" 2>/dev/null | tail -c 3500 | awk '{printf "%s%%0A", $0}')"
          echo "::error title=Linux build failed::${msg:-no build output captured}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: dist

  # No macOS or iOS builds: they need a Mac, and the unsigned bundles a
  # GitHub-hosted macOS machine could produce are of little use.

  release:
    needs: [test, server, android, windows, linux]
    # After successful builds and passed tests (or none requested) only.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      # Only the binaries: the web-dist artifact (a directory tree consumed by
      # the server job) must not end up in the release or break sha256sum.
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums (the installer and the app updater verify them)
        run: |
          cd dist
          for f in *; do [ -f "$f" ] && sha256sum "$f"; done > sha256sums.txt
          cat sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          generate_release_notes: true

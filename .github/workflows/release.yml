name: release
# Manual only. Builds the server binaries and every client for one version on
# GitHub-hosted runners and publishes them as a GitHub Release (the tag is
# created on the chosen commit). Start it from the Actions tab with the
# version, e.g. v0.2.0; that string becomes the tag and the build number shown
# by the clients and the server.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0 (becomes the tag and the build number)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.2
  APP_VERSION: ${{ inputs.version }}

jobs:
  web:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  server:
    needs: web
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/webui/dist
      - name: Cross-compile the server
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/william-aqn/family-messenger-e2e/internal/api.Version=${APP_VERSION}" \
              -o "dist/server-$os-$arch$ext" ./cmd/server
          done
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist

  android:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build APK and App Bundle (debug-signed; add a keystore for Play)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=APP_VERSION=${APP_VERSION}
          flutter build appbundle --release --dart-define=APP_VERSION=${APP_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/family-messenger-${APP_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/family-messenger-${APP_VERSION}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Windows desktop app
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release "--dart-define=APP_VERSION=$env:APP_VERSION"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          # ZipFile rather than Compress-Archive so entries use forward slashes; the
          # archive root is the app folder itself, which the in-app updater expects.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory("$PWD\build\windows\x64\runner\Release", "$env:GITHUB_WORKSPACE\dist\family-messenger-windows-x64-$env:APP_VERSION.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist

  linux:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Linux desktop app
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release --dart-define=APP_VERSION=${APP_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/dist/family-messenger-linux-x64-${APP_VERSION}.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build macOS app (unsigned)
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release --dart-define=APP_VERSION=${APP_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent "build/macos/Build/Products/Release/Family Messenger.app" "$GITHUB_WORKSPACE/dist/family-messenger-macos-${APP_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist

  # Best effort: an unsigned .app for re-signing/sideloading. A failure here
  # does not block the release.
  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build iOS app (no code signing)
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=APP_VERSION=${APP_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app "$GITHUB_WORKSPACE/dist/family-messenger-ios-unsigned-${APP_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist

  release:
    needs: [server, android, windows, linux, macos, ios]
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (the installer and the app updater verify them)
        run: cd dist && sha256sum * > sha256sums.txt && cat sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          generate_release_notes: true

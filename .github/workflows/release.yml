name: release
# Manual only. Builds the server binaries and every client for one version on
# GitHub-hosted runners and publishes them as a GitHub Release (the tag is
# created on the chosen commit). Start it from the Actions tab with the
# version, e.g. v0.2.0; that string becomes the tag and the build number shown
# by the clients and the server.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0 (becomes the tag and the build number)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.2
  APP_VERSION: ${{ inputs.version }}

jobs:
  # Fast, readable diagnostics for the self-hosted runner: the setup actions
  # only print obscure errors when the host lacks a tool or a library.
  check-runner:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Runner facts
        run: |
          . /etc/os-release 2>/dev/null && echo "os: $PRETTY_NAME" || true
          echo "arch: $(uname -m)  user: $(id -un)  cpus: $(nproc)  mem: $(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo) MB  free disk: $(df -h "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "sudo: $(sudo -n true 2>/dev/null && echo passwordless || echo 'not available without a password')"
      - name: Required tools
        run: |
          missing=""
          for t in git curl tar gzip xz unzip zip sha256sum; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          (ldconfig -p 2>/dev/null || /sbin/ldconfig -p 2>/dev/null) | grep -q 'libatomic.so.1' || missing="$missing libatomic.so.1(node)"
          if [ -n "$missing" ]; then
            echo "::error::missing on the runner:$missing. Debian/Ubuntu: apt-get install -y git curl ca-certificates xz-utils unzip zip libatomic1"
            exit 1
          fi
          echo "all required tools are present"

  web:
    needs: check-runner
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  server:
    needs: web
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/webui/dist
      - name: Cross-compile the server
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/william-aqn/family-messenger-e2e/internal/api.Version=${APP_VERSION}" \
              -o "dist/server-$os-$arch$ext" ./cmd/server
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-server
          path: dist

  android:
    needs: check-runner
    runs-on: self-hosted
    timeout-minutes: 90
    # On the self-hosted runner only the tool cache survives a rebuild of the
    # runner container, so the SDK, Gradle and pub caches live there.
    env:
      ANDROID_HOME: ${{ runner.tool_cache }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.tool_cache }}/android-sdk
      GRADLE_USER_HOME: ${{ runner.tool_cache }}/gradle
      PUB_CACHE: ${{ runner.tool_cache }}/pub-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Command-line tools with the licences accepted; Gradle then downloads
      # the platform, build-tools and NDK the app asks for (a few GB, kept
      # between runs).
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Gradle limits for a shared runner (4 GB heap, no lingering daemons)
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx1g
          EOF
      - name: Build APK and App Bundle (debug-signed; add a keystore for Play)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=APP_VERSION=${APP_VERSION}
          flutter build appbundle --release --dart-define=APP_VERSION=${APP_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/family-messenger-${APP_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/family-messenger-${APP_VERSION}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-android
          path: dist

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Windows desktop app
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release "--dart-define=APP_VERSION=$env:APP_VERSION"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          # ZipFile rather than Compress-Archive so entries use forward slashes; the
          # archive root is the app folder itself, which the in-app updater expects.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory("$PWD\build\windows\x64\runner\Release", "$env:GITHUB_WORKSPACE\dist\family-messenger-windows-x64-$env:APP_VERSION.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows
          path: dist

  linux:
    needs: check-runner
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      PUB_CACHE: ${{ runner.tool_cache }}/pub-cache
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop build dependencies (a self-hosted runner has them installed once)
        run: |
          missing=""
          for p in clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            sudo -n apt-get update && sudo -n apt-get install -y $missing
          fi
      - name: Toolchain sanity check (a Debian host also needs the libstdc++ headers)
        run: |
          printf 'int main() { return 0; }\n' > "$RUNNER_TEMP/probe.cc"
          if ! clang++ "$RUNNER_TEMP/probe.cc" -o "$RUNNER_TEMP/probe"; then
            echo "::error::clang++ cannot build a C++ program on this runner; on Debian/Ubuntu install libstdc++-<N>-dev matching the g++ version (e.g. libstdc++-12-dev)"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Linux desktop app
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release --dart-define=APP_VERSION=${APP_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/dist/family-messenger-linux-x64-${APP_VERSION}.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: dist

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build macOS app (unsigned)
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release --dart-define=APP_VERSION=${APP_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent "build/macos/Build/Products/Release/Family Messenger.app" "$GITHUB_WORKSPACE/dist/family-messenger-macos-${APP_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-macos
          path: dist

  # Best effort: an unsigned .app for re-signing/sideloading. A failure here
  # does not block the release.
  ios:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build iOS app (no code signing)
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=APP_VERSION=${APP_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app "$GITHUB_WORKSPACE/dist/family-messenger-ios-unsigned-${APP_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-ios
          path: dist

  release:
    needs: [server, android, windows, linux, macos, ios]
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      # Only the binaries: the web-dist artifact (a directory tree consumed by
      # the server job) must not end up in the release or break sha256sum.
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums (the installer and the app updater verify them)
        run: |
          cd dist
          for f in *; do [ -f "$f" ] && sha256sum "$f"; done > sha256sums.txt
          cat sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          generate_release_notes: true

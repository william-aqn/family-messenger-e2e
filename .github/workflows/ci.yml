name: ci
# Manual only (start it from the Actions tab): Go tests, web unit and browser
# tests, a Docker image build and the Flutter analysis.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests
        run: go vet ./... && go test ./...
      - name: Web unit tests and build
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium && npx playwright test
      - name: Docker image
        run: docker build -t family-messenger-e2e:ci .
  flutter:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter analyze and tests
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
